<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chemistry Notes Collection</title><style>*{box-sizing:border-box}html,body{min-height:100vh;margin:0;padding:0}body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f766e 100%);color:#f8fafc;padding:28px 18px}.wrap{max-width:920px;margin:0 auto}.hero{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:22px;margin-bottom:20px;backdrop-filter:blur(8px)}.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px}.eyebrow{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#5eead4;background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.3);padding:4px 10px;border-radius:999px;margin-bottom:8px}h1{font-size:1.6rem;margin:0 0 6px 0}.meta{font-size:.9rem;color:#cbd5e1}.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.stat{background:rgba(15,23,42,.55);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;font-size:.85rem;color:#e2e8f0}.stat strong{color:#5eead4}.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}#q{width:100%;max-width:360px;padding:11px 14px;font-size:1rem;border:1px solid rgba(255,255,255,.22);border-radius:10px;outline:none;background:rgba(15,23,42,.7);color:#f8fafc}#q::placeholder{color:#94a3b8}#q:focus{border-color:#2dd4bf;box-shadow:0 0 0 3px rgba(45,212,191,.22)}.count{font-size:.9rem;color:#cbd5e1}ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}li a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;text-decoration:none;color:#f8fafc;font-weight:500;transition:all .15s ease}li a:hover{background:rgba(45,212,191,.16);border-color:#2dd4bf;transform:translateY(-1px)}.fname{word-break:break-word}.badge{flex-shrink:0;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(45,212,191,.18);color:#5eead4;border:1px solid rgba(45,212,191,.35)}.empty{padding:16px;background:rgba(255,255,255,.07);border-radius:10px;color:#cbd5e1}</style></head><body><div class="wrap"><header class="hero"><div class="hero-top"><div><span class="eyebrow">Study Resource</span><h1>Chemistry PDF Notes</h1><div class="meta">Shared by <strong>Vimal Kumar</strong> &bull; All PDFs in one place</div></div></div><div class="stats"><div class="stat">Total PDFs: <strong id="totCount">0</strong></div><div class="stat">Total Size: <strong id="totSize">0 MB</strong></div></div></header><div class="bar"><input id="q" type="search" placeholder="PDF naam search karein..." autofocus><div class="count" id="c"></div></div><ul id="list"></ul><script>const files=[{"name": "Acid Base and Salt.pdf", "size": 562266}, {"name": "Atomic Structure.pdf", "size": 826170}, {"name": "Carbon and its Compounds.pdf", "size": 309684}, {"name": "Catalyst & Molecular Weight.pdf", "size": 3527890}, {"name": "Chem _ 10 April _ Class PNG.pdf", "size": 2439490}, {"name": "Chem _ 10 Feb _ Class PNG.pdf", "size": 7260043}, {"name": "Chem _ 11 April _ Class PNG.pdf", "size": 2876172}, {"name": "Chem _ 11 Feb _ Class PNG.pdf", "size": 4503082}, {"name": "Chem _ 14 Feb _ Class PNG.pdf", "size": 9550438}, {"name": "Chem _ 17 Feb _ Class PNG.pdf", "size": 5623121}, {"name": "Chem _ 18 Feb _ Class PNG.pdf", "size": 1418004}, {"name": "Chem _ 18 Jan _ Class PNG.pdf", "size": 1040212}, {"name": "Chem _ 20 Jan _ Class PNG.pdf", "size": 3472011}, {"name": "Chem _ 21 _ Feb _ Class PNG.pdf", "size": 1509856}, {"name": "Chem _ 24 Feb _ Class PNG.pdf", "size": 10050165}, {"name": "Chem _ 24 Jan _ Class PNG.pdf", "size": 1284541}, {"name": "Chem _ 25 June _ Class PNG.pdf", "size": 7781768}, {"name": "Chem _ 27 Feb _ Class PNG.pdf", "size": 1866970}, {"name": "Chem _ 27 Jan _ Class PNG.pdf", "size": 1761171}, {"name": "Chem _ 28 Jan _ Class PNG.pdf", "size": 1297233}, {"name": "Chem _ 29 Jan _ Class PNG.pdf", "size": 7037694}, {"name": "Chem _ 29 March _ Class PNG (3 PM).pdf", "size": 1360201}, {"name": "Chem _ 3 April _ Class PNG.pdf", "size": 1702442}, {"name": "Chem _ 30 Jan _ Class PNG.pdf", "size": 7812848}, {"name": "Chem _ 31 Jan _ Class PNG.pdf", "size": 1168190}, {"name": "Chem _ 4 April _ Class PNG.pdf", "size": 1655681}, {"name": "Chem _ 4 Feb Class PNG.pdf", "size": 1749465}, {"name": "Chem _ 6 Feb _ Class PNG.pdf", "size": 9080987}, {"name": "Chem _ 7 April _ Class PNG.pdf", "size": 1720381}, {"name": "Chem _ 7 Feb _ Class PNG.pdf", "size": 1823578}, {"name": "Chemical Reaction.pdf", "size": 9419317}, {"name": "Drugs.pdf", "size": 5643977}, {"name": "Fuel.pdf", "size": 8470147}, {"name": "Glass.pdf", "size": 5826748}, {"name": "Hydrocarbon.pdf", "size": 5283761}, {"name": "Matter.pdf", "size": 1910065}, {"name": "Mixture.pdf", "size": 8763165}, {"name": "Noble gases.pdf", "size": 8354295}, {"name": "Periodic table.pdf", "size": 2368062}, {"name": "Polymers.pdf", "size": 1433986}, {"name": "Radioactivity.pdf", "size": 400937}, {"name": "Soap & Detergent.pdf", "size": 6337409}, {"name": "Valency.pdf", "size": 8513925}, {"name": "Water Hybridization.pdf", "size": 3080218}];const q=document.getElementById('q'),list=document.getElementById('list'),c=document.getElementById('c');function fmt(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(2)+' MB'}const totalBytes=files.reduce((s,f)=>s+f.size,0);document.getElementById('totCount').textContent=files.length;document.getElementById('totSize').textContent=fmt(totalBytes);function render(){const term=q.value.trim().toLowerCase();const filtered=files.filter(f=>f.name.toLowerCase().includes(term));c.textContent=`Showing ${filtered.length} of ${files.length} PDFs`;list.innerHTML=filtered.map(f=>`<li><a href="${encodeURIComponent(f.name)}" target="_blank" rel="noopener"><span class="fname">${f.name}</span><span class="badge">${fmt(f.size)}</span></a></li>`).join('')||'<li class="empty">Koi matching PDF nahi mili.</li>';}q.addEventListener('input',render);render();</script></div></body></html>
