<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Notes Collection</title><style>*{box-sizing:border-box}html,body{min-height:100vh;margin:0;padding:0}body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f766e 100%);color:#f8fafc;padding:28px 18px}.wrap{max-width:920px;margin:0 auto}.hero{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:22px;margin-bottom:20px;backdrop-filter:blur(8px)}.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px}.eyebrow{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#5eead4;background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.3);padding:4px 10px;border-radius:999px;margin-bottom:8px}h1{font-size:1.6rem;margin:0 0 6px 0}.meta{font-size:.9rem;color:#cbd5e1}.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.stat{background:rgba(15,23,42,.55);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;font-size:.85rem;color:#e2e8f0}.stat strong{color:#5eead4}.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}#q{width:100%;max-width:360px;padding:11px 14px;font-size:1rem;border:1px solid rgba(255,255,255,.22);border-radius:10px;outline:none;background:rgba(15,23,42,.7);color:#f8fafc}#q::placeholder{color:#94a3b8}#q:focus{border-color:#2dd4bf;box-shadow:0 0 0 3px rgba(45,212,191,.22)}.count{font-size:.9rem;color:#cbd5e1}ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}li a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;text-decoration:none;color:#f8fafc;font-weight:500;transition:all .15s ease}li a:hover{background:rgba(45,212,191,.16);border-color:#2dd4bf;transform:translateY(-1px)}.fname{word-break:break-word}.badge{flex-shrink:0;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(45,212,191,.18);color:#5eead4;border:1px solid rgba(45,212,191,.35)}.empty{padding:16px;background:rgba(255,255,255,.07);border-radius:10px;color:#cbd5e1}</style></head><body><div class="wrap"><header class="hero"><div class="hero-top"><div><span class="eyebrow">Physics Study Resource</span><h1>Physics PDF Notes</h1><div class="meta">Shared by <strong>Vimal Kumar</strong> &bull; All PDFs in one place</div></div></div><div class="stats"><div class="stat">Total PDFs: <strong id="totCount">0</strong></div><div class="stat">Total Size: <strong id="totSize">0 MB</strong></div></div></header><div class="bar"><input id="q" type="search" placeholder="PDF naam search karein..." autofocus><div class="count" id="c"></div></div><ul id="list"></ul><script>const files=[{"name": "Phy (Eng) Full Notes.pdf", "size": 6663349}, {"name": "Phy (Hindi) Full Notes.pdf", "size": 8143875}, {"name": "Phy _ 09 Jan _ Class PNG.pdf", "size": 882501}, {"name": "Phy _ 1 May _ Class PNG.pdf", "size": 727689}, {"name": "Phy _ 10 April _ Class PNG.pdf", "size": 972625}, {"name": "Phy _ 10 Jan _ Class PNG.pdf", "size": 4244724}, {"name": "Phy _ 11 Jan _ Class PNG.pdf", "size": 4971208}, {"name": "Phy _ 12 April _ Class PNG.pdf", "size": 794869}, {"name": "Phy _ 12 Aug _ Class PNG.pdf", "size": 4312081}, {"name": "Phy _ 12 May _ Class PNG.pdf", "size": 636886}, {"name": "Phy _ 13 May _ Class PNG.pdf", "size": 5972233}, {"name": "Phy _ 15 May _ Class PNG.pdf", "size": 2027743}, {"name": "Phy _ 16 Jan _ Class PNG.pdf", "size": 5194396}, {"name": "Phy _ 18 Jan _ Class PNG.pdf", "size": 775593}, {"name": "Phy _ 19 Dec _ Class PNG.pdf", "size": 6147609}, {"name": "Phy _ 19 May _ Class PNG.pdf", "size": 3798701}, {"name": "Phy _ 2 Jan _ Class PNG.pdf", "size": 827629}, {"name": "Phy _ 20 March _ Clas s=files.reduce((s,f)=>s+f.size,0);document.getElementById('totCount').textContent=files.length;document.getElementById('totSize').textContent=fmt(totalBytes);function render(){const term=q.value.trim().toLowerCase();const filtered=files.filter(f=>f.name.toLowerCase().includes(term));c.textContent=`Showing ${filtered.length} of ${files.length} PDFs`;list.innerHTML=filtered.map(f=>`<li><a href="${encodeURIComponent(f.name)}" target="_blank" rel="noopener"><span class="fname">${f.name}</span><span class="badge">${fmt(f.size)}</span></a></li>`).join('')||'<li class="empty">Koi matching PDF nahi mili.</li>';}q.addEventListener('input',render);render();</script></div></body></html>
